<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!--
      Preloaded from this origin so the faces are in hand before first paint: a cross-origin
      stylesheet costs a second round trip, and the swap at the end of it re-lays out every block of
      text — measured at 8px on the hero. `@font-face` lives in src/app/styles/fonts.css; the files
      are regenerated by scripts/fetch-fonts.mjs.
    -->
    <link rel="preload" href="/fonts/geist.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/geist-mono.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/newsreader.woff2" as="font" type="font/woff2" crossorigin />
    <title>Umbra Playground</title>
    <script>
      /* Inline and before the bundle on purpose: a stored preference applied from a module leaves
         the frames until that module runs painting the other scheme — measured at ~64ms of white
         with `dark` stored. The key is `STORAGE_KEY` in ThemeProvider.tsx, which owns it after
         this point; a script that cannot import has to restate it. */
      (function () {
        var stored = null;
        try {
          stored = localStorage.getItem('umbra:color-scheme');
        } catch (error) {
          stored = null;
        }
        var mode =
          stored === 'light' || stored === 'dark'
            ? stored
            : matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
        document.documentElement.setAttribute('data-color-scheme', mode);
        document.documentElement.style.colorScheme = mode;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
